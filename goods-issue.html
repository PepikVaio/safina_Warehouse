
<!-- Goods issue screen. -->
<main class="container">
  <section class="view hidden" id="issueView">
    <div class="panel movement-panel">
      <p class="eyebrow" id="issueEyebrow">VÝDEJ MATERIÁLU</p>

      <h2 id="issueTitle">Výdej</h2>

      <p class="muted" id="issueDescription"></p>

      <form class="form-grid" id="issueForm">
        <label class="field full">
          <span>Náhradní díl</span>
          <select id="issuePart" required></select>
        </label>

        <label class="field full">
          <span>Umístění</span>
          <select id="issueLocation" required></select>
        </label>

        <label class="field">
          <span>Množství (ks)</span>
          <input id="issueQty" type="number" min="1" step="1" value="1" required/>
        </label>

        <p class="inline-error full" id="issueError"></p>

        <div class="form-actions full">
          <button class="btn btn-light" id="issueCancel" type="button">
            Zpět
          </button>

          <button class="btn btn-primary" id="issueSubmit" type="submit">
            Potvrdit výdej
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
