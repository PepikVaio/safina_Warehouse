<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <title>Sklad náhradních dílů</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screenLoader" class="container" role="status" style="padding:32px 16px">Načítám sklad…</div>
  <div id="appScreens"></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (async function loadScreens() {
      const target = document.getElementById('appScreens');
      const screens = [
        'screens/main.html',
        'screens/movement.html',
        'screens/history.html',
        'screens/new-card.html',
        'screens/user.html',
        'screens/users.html',
        'screens/detail.html'
      ];
      for (const path of screens) {
        const response = await fetch(path);
        if (!response.ok) throw new Error('Nelze načíst ' + path + ' (' + response.status + ').');
        target.insertAdjacentHTML('beforeend', await response.text());
      }
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('Nepodařilo se načíst knihovnu QR kódů.'));
        document.head.appendChild(script);
      });
      document.getElementById('screenLoader').remove();
      const app = document.createElement('script');
      app.src = 'app.js';
      app.onerror = () => showLoadError('Nepodařilo se načíst app.js.');
      document.body.appendChild(app);
    })().catch(error => showLoadError(error.message));

    function showLoadError(message) {
      const loader = document.getElementById('screenLoader');
      if (loader) loader.textContent = 'Chyba při načítání aplikace: ' + message;
    }
  </script>
</body>
</html>
