<section class="view hidden" id="historyView">
    <div class="toolbar"><input id="historySearch" placeholder="Hledat uživatele, díl nebo umístění"
            type="search" /><select id="historyFilter">
            <option value="all">Všechny pohyby</option>
            <option value="in">Naskladnění</option>
            <option value="out">Vyskladnění</option>
        </select></div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Datum a čas</th>
                    <th>Uživatel</th>
                    <th>Díl</th>
                    <th>Pohyb</th>
                    <th>Umístění</th>
                    <th>Množství</th>
                </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>
</section>
