<dialog class="dialog" id="loginDialog">
  <form id="settingsForm">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">PŘIHLÁŠENÍ DO SKLADU</p>
        <h2>Přihlášení</h2>
      </div>
    </div>

    <div class="form-grid" id="loginFields">
      <label class="field full">
        <span>GitHub token</span>
        <input autocomplete="off" id="accessToken" placeholder="github_pat_…" required type="password" />
      </label>
    </div>

      <p class="muted dialog-note">
        Pro přístup do skladové aplikace je nutné zadat GitHub token s oprávněním k soukromému repozitáři <strong>safina_Warehouse_Data</strong>. Přístupové údaje jsou poskytovány správcem skladu.
      </p>

    <div class="dialog-footer">
      <button class="btn btn-primary" id="saveSettingsButton" type="submit">
        Uložit a přihlásit
      </button>
    </div>
  </form>
</dialog>
