<dialog class="dialog" id="partDialog">
    <form id="partForm">
        <div class="dialog-header">
            <div>
                <p class="eyebrow">KARTA NÁHRADNÍHO DÍLU</p>
                <h2 id="dialogTitle">Nová karta</h2>
            </div><button class="icon-btn" id="closeDialog" type="button">×</button>
        </div><input id="partId" type="hidden" />
        <div class="form-grid">
            <label class="field full"><span>Název dílu *</span><input id="partName" required="" /></label><label
                class="field"><span>Objednací číslo</span><input id="partNumber" /></label><label
                class="field"><span>Interní ID</span><input id="partInternalId" readonly="" /></label>
            <div class="field full"><span>Obrázek dílu</span><input accept="image/*" id="partImage" type="file" /><img
                    alt="Náhled obrázku" class="image-preview hidden" id="imagePreview" /><small
                    class="muted dialog-note">Nahraný obrázek bude uložen ve složce images v soukromém GitHub
                    repozitáři.</small></div>
            <div class="section-label full">Dodavatelé</div>
            <div class="supplier-list full" id="suppliers"></div><button class="btn btn-light full" id="addSupplier"
                type="button">＋ Přidat dodavatele</button>
            <div class="section-label full">Interní informace</div><label class="field"><span>Interní karta</span><input
                    id="partCard" /></label><label class="field"><span>Středisko</span><input
                    id="partCostCenter" /></label><label class="field full"><span>Zařízení</span><input
                    id="partMachine" /></label><label class="field full"><span>Minimální množství (ks)</span><input
                    id="partMinimum" min="0" step="1" type="number" value="0" /></label><label
                class="field full"><span>Poznámka</span><textarea id="partNote" rows="3"></textarea></label>
        </div>
        <div class="dialog-footer"><button class="btn btn-light" id="cancelPart" type="button">Zrušit</button><button
                class="btn btn-primary" type="submit">Uložit</button></div>
    </form>
</dialog>
