    </div>
    <button class="icon-btn" id="closeDetail">×</button>
  </div>

  <div id="detailContent"></div>

  <div class="dialog-footer dialog-footer--part-detail">

    <div class="detail-qr-action">

    <div class="detail-main-actions">
