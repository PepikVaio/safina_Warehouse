
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tisk QR štítku</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f1f3f5;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .label {
      width: 63.5mm;
      height: 76.2mm;
      margin: auto;
      padding: 3mm;
      background: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .name {
      min-height: 18mm;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 17pt;
      font-weight: bold;
      line-height: 1.1;
      overflow-wrap: anywhere;
      border-bottom: 1px solid #222;
      padding-bottom: 2mm;
    }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      gap: 2mm;
      padding-top: 2mm;
    }

    .qr {
      width: 48%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr img,
    .qr canvas {
      width: 100% !important;
      height: auto !important;
      image-rendering: pixelated;
    }

    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4mm;
    }

    .field {
      overflow-wrap: anywhere;
    }

    .field-label {
      font-size: 7pt;
      font-weight: bold;
      color: #555;
      margin-bottom: 1mm;
    }

    .field-value {
      font-size: 10pt;
      font-weight: bold;
      line-height: 1.15;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #666;
    }

    @page {
      size: 63.5mm 76.2mm;
      margin: 0;
    }

    @media print {
      body {
        margin: 0;
        padding: 0;
        background: white;
      }

      .toolbar {
        display: none;
      }

      .label {
        margin: 0;
        width: 63.5mm;
        height: 76.2mm;
      }
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button onclick="window.print()">Tisk štítku</button>
    <button onclick="window.close()">Zavřít</button>
  </div>

  <div class="label" id="label" style="display:none">
    <div class="name" id="partName"></div>

    <div class="content">
      <div class="qr" id="qr"></div>
      <div class="info" id="info"></div>
    </div>
  </div>

  <div class="empty" id="empty">
    Zatím nebyly předány žádné údaje položky.
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const $ = id => document.getElementById(id);

    function addField(label, value) {
      if (!value || !String(value).trim()) return;

      const field = document.createElement("div");
      field.className = "field";

      const title = document.createElement("div");
      title.className = "field-label";
      title.textContent = label;

      const text = document.createElement("div");
      text.className = "field-value";
      text.textContent = value;

      field.append(title, text);
      $("info").appendChild(field);
    }

    function loadLabel() {
      const raw = localStorage.getItem("sklad-print-label");

      if (!raw) return;

      try {
        const part = JSON.parse(raw);

        if (!part.id) {
          throw new Error("Chybí ID položky.");
        }

        $("partName").textContent = part.name || "";
        $("info").innerHTML = "";
        $("qr").innerHTML = "";

        addField("OBJEDNACÍ ČÍSLO", part.partNumber);

        const supplier = (part.suppliers || [])
          .find(s => s?.name?.trim());

        if (supplier) {
          addField("DODAVATEL", supplier.name);
        }

        addField("TYP ZAŘÍZENÍ", part.machine);

        new QRCode($("qr"), {
          text: String(part.id),
          width: 300,
          height: 300,
          correctLevel: QRCode.CorrectLevel.M
        });

        $("empty").style.display = "none";
        $("label").style.display = "flex";

      } catch (error) {
        $("empty").textContent =
          "Nepodařilo se načíst údaje položky.";
      }
    }

    loadLabel();
  </script>

</body>
</html>
