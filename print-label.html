<!-- HTML fragment loaded by index.html; keep app element IDs unchanged. -->

<dialog class="dialog print-label-dialog" id="printLabelDialog">
  <div class="dialog-header">
    <div>
      <h2>Tisk QR štítku</h2>
      <p class="muted">Náhled štítku před tiskem</p>
    </div>

    <button class="icon-btn" id="printLabelClose" type="button">×</button>
  </div>

  <div class="label-preview print-label-preview" id="printLabel">
    <div class="print-label-title" id="printLabelTitle"></div>

    <div class="print-label-content">
      <div class="print-label-qr" id="printQr"></div>

      <div class="print-label-info">
        <div class="print-label-field hidden" id="printPartNumberRow">
          <span>Objednací číslo</span>
          <strong id="printPartNumber"></strong>
        </div>

        <div class="print-label-field hidden" id="printSupplierRow">
          <span>Dodavatel</span>
          <strong id="printSupplier"></strong>
        </div>

        <div class="print-label-field hidden" id="printMachineRow">
          <span>Zařízení</span>
          <strong id="printMachine"></strong>
        </div>
      </div>
    </div>
  </div>

  <div class="dialog-footer print-label-footer">
    <button class="btn btn-light" id="printLabelBack" type="button">
      Zpět
    </button>

    <button class="btn btn-primary" id="printLabelButton" type="button">
      Tisk štítku
    </button>
  </div>
</dialog>
