<!-- Stock movement screen. Element IDs are used by app.js. -->
<main class="container">
<section class="view hidden" id="movementView"><div class="panel movement-panel"><p class="eyebrow" id="movementEyebrow">POHYB MATERIÁLU</p><h2 id="movementTitle">Naskladnění</h2><p class="muted" id="movementDescription"></p><form class="form-grid" id="movementForm"><label class="field full"><span>Náhradní díl</span><select id="movementPart" required=""></select></label><label class="field full"><span>Umístění</span><select id="movementLocation" required=""></select></label><div class="field full hidden" id="newLocationFields"><span>Nové umístění</span><div class="new-location-inputs"><input id="newRack" placeholder="Regál"/><input id="newBox" placeholder="Box"/></div></div><label class="field"><span>Množství (ks)</span><input id="movementQty" min="1" required="" step="1" type="number" value="1"/></label><p class="inline-error full" id="movementError"></p><div class="form-actions full"><button class="btn btn-light" id="cancelMovement" type="button">Zpět</button><button class="btn btn-primary" id="movementSubmit">Potvrdit</button></div></form></div></section>
</main>
