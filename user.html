
<!-- User profile and login dialogs. -->
<dialog class="dialog" id="settingsDialog">
  <form id="settingsForm">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">PŘIHLÁŠENÝ ÚČET</p>
        <h2>Uživatel</h2>
      </div>
      <button class="icon-btn" id="closeSettings" type="button">×</button>
    </div>

    <div class="user-profile-info hidden" id="userProfileInfo">

      <div>
        <span>Jméno</span>
        <strong id="settingsFirstName">—</strong>
      </div>

      <div>
        <span>Příjmení</span>
        <strong id="settingsLastName">—</strong>
      </div>

      <div>
        <span>Status / oprávnění</span>
        <strong id="settingsRole">—</strong>
      </div>

      <div style="grid-column: 1 / -1; width: 100%;">
        <label class="field" style="display: block; width: 100%;">
          <span>GitHub token</span>
          <input
            id="profileToken"
            type="password"
            value=""
            readonly
            autocomplete="off"
            style="width: 100%;"
          />
        </label>
      </div>

      <div style="grid-column: 1 / -1; width: 100%; margin-top: 12px;">
        <div class="section-label">Aktivita uživatele</div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px;">

          <div>
            <span>Poslední přihlášení</span>
            <strong id="settingsLastLogin">—</strong>
          </div>

          <div>
            <span>Provedené operace</span>
            <strong id="settingsOperationCount">—</strong>
          </div>

          <div>
            <span>Verze aplikace</span>
            <strong id="appVersion">—</strong>
          </div>

        </div>
      </div>
    </div>

    <div class="form-grid settings-grid" id="loginFields">
      <label class="field full">
        <span>GitHub token</span>
        <input
          autocomplete="off"
          id="accessToken"
          placeholder="github_pat_…"
          required
          type="password"
        />
      </label>
    </div>

    <div class="dialog-footer">
      <button class="btn btn-light" id="logoutBtn" type="button">
        Odhlásit
      </button>

      <button class="btn btn-light" id="closeSettings2" type="button">
        Zavřít
      </button>

      <button class="btn btn-primary" id="saveSettingsButton" type="submit">
        Uložit přístup
      </button>
    </div>
  </form>
</dialog>

<dialog class="dialog" id="inviteDialog">
  <div class="dialog-header">
    <div>
      <p class="eyebrow">POZVÁNKA DO SKLADU</p>
      <h2>Nastavení přístupu</h2>
    </div>
  </div>

  <p class="muted" id="inviteDescription"></p>

  <p>
    Po uložení se přístupový token uloží v tomto prohlížeči.
    Token se na stránce nezobrazuje.
  </p>

  <p class="invite-status" id="inviteSaveStatus" role="status"></p>

  <div class="dialog-footer">
    <button class="btn btn-primary" id="saveInvite" type="button">
      Uložit přístup
    </button>
  </div>
</dialog>
