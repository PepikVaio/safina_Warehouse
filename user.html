
<!-- Údaje přihlášeného uživatele -->
<dialog class="dialog" id="settingsDialog">
  <div>
    <div class="dialog-header">
      <div style="flex: 1;">
        <p class="eyebrow">PŘIHLÁŠENÝ ÚČET</p>
        <h2>
          <span id="settingsFirstName">—</span>
          <span id="settingsLastName">—</span>
        </h2>
        <p class="muted" id="settingsAccountType"></p>
      </div>

      <button class="icon-btn" id="closeSettings" type="button">×</button>
    </div>

    <div class="user-profile-info hidden" id="userProfileInfo">
      <div
        class="profile-info-grid"
        style="display: grid; grid-template-columns: 1fr 1fr; width: 100%;"
      >
        <div class="profile-info-heading">Informace</div>
        <div class="profile-info-heading">Hodnota</div>

        <div>Status</div>
        <strong id="settingsRole">—</strong>

        <div>Poslední přihlášení</div>
        <strong id="settingsLastLogin">—</strong>

        <div>Provedené operace</div>
        <strong id="settingsOperationCount">—</strong>

        <div>Verze aplikace</div>
        <strong id="appVersion">—</strong>
      </div>
    </div>

    <div
      class="dialog-footer"
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        flex-wrap: nowrap;
      "
    >
      <div style="display: flex; gap: 4px; flex-shrink: 0;">
        <button
          class="btn btn-light"
          id="listUsersBtn"
          type="button"
          disabled
          style="padding-left: 8px; padding-right: 8px; white-space: nowrap;"
        >
          Uživatelé
        </button>

        <button
          class="btn btn-light"
          id="addUserBtn"
          type="button"
          disabled
          style="padding-left: 8px; padding-right: 8px; white-space: nowrap;"
        >
          Přidat
        </button>
      </div>

      <div style="display: flex; gap: 4px; flex-shrink: 0;">
        <button
          class="btn btn-light"
          id="logoutBtn"
          type="button"
          style="padding-left: 8px; padding-right: 8px; white-space: nowrap;"
        >
          Odhlásit
        </button>

        <button
          class="btn btn-light"
          id="cancelSettings"
          type="button"
          style="padding-left: 8px; padding-right: 8px; white-space: nowrap;"
        >
          Zavřít
        </button>
      </div>
    </div>
  </div>
</dialog>
