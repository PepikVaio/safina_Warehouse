<!-- Správa uživatelů -->
<dialog class="dialog" id="usersDialog">
  <div class="dialog-header">
    <div>
      <p class="eyebrow">SPRÁVA PŘÍSTUPŮ</p>
      <h2>Uživatelé</h2>
    </div>
    <button class="icon-btn" id="closeUsers" type="button">×</button>
  </div>
  <h3>Seznam uživatelů</h3>
  <div id="usersList" class="users-list"></div>
  <div class="divider"></div>
  <h3>Přidat uživatele</h3>
  <form id="userForm">
    <div class="form-grid">
      <label class="field">
        <span>Jméno</span>
        <input
          id="newUserFirst"
          type="text"
          placeholder="Jméno"
          required
        />
      </label>
      <label class="field">
        <span>Příjmení</span>
        <input
          id="newUserLast"
          type="text"
          placeholder="Příjmení"
          required
        />
      </label>
      <label class="field">
        <span>Role uživatele</span>
        <select id="newUserRole" required>
          <option value="read">Read – pouze prohlížení</option>
          <option value="write">Write – úpravy skladu</option>
          <option value="admin">Admin – správce</option>
        </select>
      </label>
      <label class="field full">
        <span>GitHub token uživatele</span>
        <input
          id="newUserToken"
          type="password"
          placeholder="github_pat_…"
          autocomplete="off"
          required
        />
      </label>
    </div>
    <p class="invite-status" id="userSaveStatus" role="status"></p>
    <div class="dialog-footer">
      <button
        class="btn btn-primary"
        id="saveUserButton"
        type="submit"
      >
        Uložit uživatele
      </button>
    </div>
  </form>
  <div class="invite-result hidden" id="inviteResult">
    <div class="divider"></div>
    <h3>Pozvánka připravena</h3>
    <p class="muted">
      Uživatel byl uložen do soukromého GitHub repozitáře.
      Nyní mu můžeš předat pozvánku.
    </p>
    <label class="field">
      <span>Odkaz na pozvánku</span>
      <input
        id="inviteLink"
        type="text"
        readonly
        autocomplete="off"
      />
    </label>
    <div class="dialog-footer">
      <button
        class="btn btn-light"
        id="copyInviteOnly"
        type="button"
      >
        Kopírovat odkaz
      </button>
      <button
        class="btn btn-primary"
        id="copyInvite"
        type="button"
      >
        Sdílet pozvánku
      </button>
    </div>
  </div>
</dialog>
<!-- Aktivace pozvánky novým uživatelem -->
<dialog class="dialog" id="inviteDialog">
  <div class="dialog-header">
    <div>
      <p class="eyebrow">POZVÁNKA DO SKLADU</p>
      <h2>Nastavení přístupu</h2>
    </div>
  </div>
  <p class="muted" id="inviteDescription"></p>
  <p>
    Po uložení se přístupový token uloží v tomto prohlížeči.
    Token se na stránce nezobrazuje.
  </p>
  <p class="invite-status" id="inviteSaveStatus" role="status"></p>
  <div class="dialog-footer">
    <button class="btn btn-primary" id="saveInvite" type="button">
      Uložit přístup
    </button>
  </div>
</dialog>
